# ---------------------------------------------------------------- Java toolchain
# node_modules/@react-native/gradle-plugin 是个 included build，它编译 Kotlin 时
# 要求 toolchain {languageVersion=17}。而 Gradle 默认会去 foojay 自动下载 JDK 17，
# foojay 会 302 到 github.com/adoptium/...，在国内不可达，于是构建直接失败：
#     > Cannot find a Java installation matching {languageVersion=17}
#
# 解决：自己装一个 JDK 17，然后在【用户级】配置里告诉 Gradle 它在哪：
#     ~/.gradle/gradle.properties        （Windows: C:\Users\<你>\.gradle\gradle.properties）
#         org.gradle.java.installations.paths=<JDK17 路径>
#         org.gradle.java.installations.auto-download=false
#
# 注意：这两个属性必须放在 GRADLE_USER_HOME 的配置里，不要写在项目这个文件里 ——
# gradle-plugin 是 included build，只认 GRADLE_USER_HOME 的配置。
# 另外路径要用正斜杠：gradle.properties 是 Java properties，反斜杠是转义符，
# "C:\Users" 里的 \U 会被吃掉。
